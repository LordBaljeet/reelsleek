<!-- ── SEEKBAR COMPONENT ── -->
<template id="reelsleek-seekbar-template">
    <style>
        .reelsleek-video-control {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 12px;
            opacity: 0;
            cursor: pointer;
            margin: 0;
            z-index: 1000;
        }

        /* Base track layer (Uncompleted portion) */
        .reelsleek-seekbar-track {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: #6b6b6ba2;
            z-index: 998;
            pointer-events: none;
            transition: height 0.1s;
        }

        /* Dynamic fill layer (Completed portion) */
        .reelsleek-seekbar-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: #fff;
            transform-origin: left;
            transform: scaleX(0);
            z-index: 999;
            pointer-events: none;
            transition: height 0.1s;
            /* Overridden dynamically in JS for transform speeds */
        }

        .reelsleek-seekbar {
            appearance: none;
            -webkit-appearance: none;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: transparent;
            /* Made transparent to show custom layers beneath */
            outline: none;
            cursor: pointer;
            margin: 0;
            z-index: 1000;
            transition: height 0.1s;
        }

        /* Chrome: transparent track so the element layers show through */
        .reelsleek-seekbar::-webkit-slider-runnable-track {
            height: 100%;
            border: none;
            background: transparent;
        }

        /* Chrome: invisible thumb (seekbar uses a thin progress bar, not a visible thumb) */
        .reelsleek-seekbar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            opacity: 0;
            border-radius: 0;
            width: 2px;
            height: 14px;
            background: #fff;
            border: none;
            cursor: pointer;
        }

        /* Firefox: transparent track */
        .reelsleek-seekbar::-moz-range-track {
            height: 100%;
            background: transparent;
        }

        /* Firefox thumb */
        .reelsleek-seekbar::-moz-range-thumb {
            opacity: 0;
            border-radius: 0;
            width: 2px;
            background: #fff;
            border: none;
        }

        /* Expand track layers on hover */
        .reelsleek-video-control:hover .reelsleek-seekbar,
        .reelsleek-video-control:hover .reelsleek-seekbar-track,
        .reelsleek-video-control:hover .reelsleek-seekbar-fill {
            height: 100%;
        }

        /* Show on parent hover */
        div:has(.reelsleek-video-control):hover > .reelsleek-video-control {
            opacity: 1;
        }

        body.reelsleek-seekbar-always-visible .reelsleek-video-control {
            opacity: 1;
        }

        /* Show thumb when paused */
        .reelsleek-video-control[data-show-paused="true"] {
            opacity: 1;

            .reelsleek-seekbar::-webkit-slider-thumb {
                opacity: 1;
            }

            .reelsleek-seekbar::-moz-range-thumb {
                opacity: 1;
            }
        }

        /* ── Seekbar Tooltip Preview ── */

        .reelsleek-seekbar-tooltip {
            position: absolute;
            bottom: 16px;
            /* Positioned right above the expanded track */
            left: 0;
            transform: translateX(-50%);
            background-color: #6b6b6ba2;
            color: #fff;
            padding: 4px 7px;
            border-radius: 4px;
            font-size: 11px;
            font-family: sans-serif;
            pointer-events: none;
            /* Prevents the tooltip from hijacking mouse events */
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 1001;
            white-space: nowrap;
        }

        /* Reveal tooltip when hovering over the control zone */
        .reelsleek-video-control:hover .reelsleek-seekbar-tooltip {
            opacity: 1;
        }
    </style>
    <div class="reelsleek-seekbar-track"></div>
    <div class="reelsleek-seekbar-fill"></div>
    <input
        type="range"
        class="reelsleek-seekbar"
        min="0"
        max="100"
        step="any"
        aria-label="Seek"
    />
    <div class="reelsleek-seekbar-tooltip">0:00</div>
</template>
